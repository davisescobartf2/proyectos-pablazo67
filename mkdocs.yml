site_name: Documentació del Projecte

theme:
  name: bootstrap
  paletete:
    primary: deep-purple
    accent: indigo

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html

plugins:
    - mkdocs-video:
        is_video: true
        mark: "gifs"
        video_autoplay: true
        video_loop: true
        video_controls: false


nav:
  - Inici: index.md
  - Grupo: grupo.md
  - Explicació: explicacio.md
